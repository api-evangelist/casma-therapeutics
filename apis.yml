name: Casma Therapeutics
description: 'Casma Therapeutics is a privately held clinical-stage biotechnology company
  founded in 2018 and headquartered at 201 Brookline Ave, Suite 1401, Boston, MA. Casma
  develops novel cellular degradation medicines built on the autophagy pathway — the
  conserved process cells use to clear damaged components. Its PHLYT (Phagosome-Lysosome
  Targeting) platform initiates target-specific autophagic degradation of disease targets
  independent of size or complexity, reaching beyond single proteins to organelles,
  protein aggregates and large signaling complexes, with programs spanning oncology,
  inflammation, neurodegeneration and metabolic disease. Casma was named to the Fierce
  15 list in 2019. The company publishes no public developer API, developer portal,
  SDKs or machine-readable API contract; it is catalogued here as a company profile
  only.'
